<div class="card">
  <div class="form-grid">
    <input [(ngModel)]="clientFormDto.name" placeholder="Name">
    <input [(ngModel)]="clientFormDto.mobile" placeholder="Mobile">
    <select [(ngModel)]="clientFormDto.gender"><option>Male</option><option>Female</option><option>Other</option></select>
    <input [(ngModel)]="clientFormDto.address" placeholder="Address">
  </div>
  <button class="btn" (click)="saveClient()">Save client</button>
</div>
