<section class="stats">
  <div class="stat"><small>Money lent (active)</small><b>₹{{ clientDetailsService.lent() | number:'1.0-0' }}</b></div>
  <div class="stat green"><small>Total to receive</small><b>₹{{ clientDetailsService.receivable() | number:'1.0-0' }}</b></div>
  <div class="stat red"><small>Overdue loans</small><b>{{ clientDetailsService.overdue() }}</b></div>
  <div class="stat"><small>Clients</small><b>{{ clientDetailsService.clientsCount() }}</b></div>
</section>
