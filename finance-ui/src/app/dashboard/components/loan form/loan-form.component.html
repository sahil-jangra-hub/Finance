<div class="card">
  <h3>🏦 Give Loan</h3>
  <div class="form-grid">
    <select [(ngModel)]="selectedClientName">
      <option value="" disabled>Select a client</option>
      <option *ngFor="let client of activeClients" [value]="client.Name">{{ client.Name }}</option>
    </select>
    <input type="number" [(ngModel)]="clientFormDto.principal" placeholder="Amount ₹">
    <input type="number" [(ngModel)]="clientFormDto.interestPercent" placeholder="Interest % / month">
    <input type="date" [(ngModel)]="clientFormDto.dueDate">
    <input type="number" [(ngModel)]="clientFormDto.penaltyPerDay" placeholder="Penalty ₹ / day">
  </div>
  <button class="btn" (click)="saveLoan()">Add loan</button>
</div>
