<app-dashboard-header [name]="name" (logout)="out()"></app-dashboard-header>
<main class="container">
  <app-dashboard-stats
    [lent]="lent"
    [receivable]="receivable"
    [overdue]="overdue"
    [clientCount]="clients.length">
  </app-dashboard-stats>

  <section class="grid2">
    <app-client-form></app-client-form>
    <app-loan-form [activeClients]="activeClients" (save)="saveLoan()"></app-loan-form>
  </section>

  <app-loans-table [loans]="loans" [(query)]="q" (clearLoan)="clearLoan($event)"></app-loans-table>

  <app-clients-list
    [root]="root"
    [documents]="docs"
    [(docType)]="docType"
    (clearClient)="clearClient($event)"
    (deleteClient)="del($event)"
    (showDocuments)="showDocs($event)"
    (uploadFile)="up($event)">
  </app-clients-list>
</main>
