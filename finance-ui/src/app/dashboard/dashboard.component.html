<app-dashboard-header [name]="name" (logout)="out()"></app-dashboard-header>
<main class="container">
  <app-dashboard-stats
    [lent]="lent"
    [receivable]="receivable"
    [overdue]="overdue"
    [clientCount]="clients.length">
  </app-dashboard-stats>

  <section class="grid2">
    <app-client-form></app-client-form>
    <app-loan-form [activeClients]="activeClients"></app-loan-form>
  </section>

  <app-loans-table></app-loans-table>

  <app-clients-list
    [root]="root"
    [documents]="docs"
    [(docType)]="docType"
    (showDocuments)="showDocs($event)"
    (uploadFile)="up($event)">
  </app-clients-list>
</main>
